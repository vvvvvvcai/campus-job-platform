server:
  port: 8085

spring:
  application:
    name: recommend-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/campus_job?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: "123456"
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
  redis:
    host: 127.0.0.1
    port: 6379
    database: 0
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.campus.recommend.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

recommend:
  ai:
    enabled: true
    api-key: 2e35954a5e5646b4b91299f378b7a6b3.fLxDRoRuCXTkxHz8
    base-url: https://open.bigmodel.cn/api/paas/v4
    model: glm-4-flash
    connect-timeout: 5000
    read-timeout: 30000
    max-jobs: 30
    cache-minutes: 30

knife4j:
  enable: true
  openapi:
    title: 推荐服务API
    description: 个性化职位推荐接口
    version: 1.0.0
