server:
  port: 9000

spring:
  application:
    name: gateway-service
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/user/**
          filters:
            - StripPrefix=0
        - id: upload-service
          uri: lb://user-service
          predicates:
            - Path=/api/upload/**
          filters:
            - StripPrefix=0
        - id: upload-static
          uri: lb://user-service
          predicates:
            - Path=/uploads/**
          filters:
            - StripPrefix=0
        - id: company-service
          uri: lb://company-service
          predicates:
            - Path=/api/company/**
          filters:
            - StripPrefix=0
        - id: job-service
          uri: lb://job-service
          predicates:
            - Path=/api/job/**
          filters:
            - StripPrefix=0
        - id: favorite-service
          uri: lb://job-service
          predicates:
            - Path=/api/favorite/**
          filters:
            - StripPrefix=0
        - id: application-service
          uri: lb://application-service
          predicates:
            - Path=/api/application/**
          filters:
            - StripPrefix=0
        - id: resume-service
          uri: lb://application-service
          predicates:
            - Path=/api/resume/**
          filters:
            - StripPrefix=0
        - id: recommend-service
          uri: lb://recommend-service
          predicates:
            - Path=/api/recommend/**
          filters:
            - StripPrefix=0
